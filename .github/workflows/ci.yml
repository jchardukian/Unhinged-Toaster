name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Offline template smoke render (FFmpeg only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-pil
          npm run brand:generate
          node packages/pipeline/dist/cli.js demo --offline
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 work/demo/demo_final.mp4 | grep -q "1080,1920"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-render
          path: |
            work/demo/demo_final.mp4
            work/demo/demo_final.jpg
          retention-days: 7

  # Heavy, non-blocking probes from a real GitHub-runner IP; run only when the push's commit message contains [probe].
  # reddit: discovery + download yield for a representative sample. youtube: which yt-dlp player clients (if any)
  # get past YouTube's bot wall without cookies. Results land in each job's summary.
  sourcing-probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: reddit
            sources: reddit_rss
            limit: '30'
            fetch: '25'
            clients: ''
          - name: youtube-default
            sources: youtube_viral
            limit: '10'
            fetch: '2'
            clients: ''
          - name: youtube-android
            sources: youtube_viral
            limit: '10'
            fetch: '2'
            clients: android
          - name: youtube-android_vr
            sources: youtube_viral
            limit: '10'
            fetch: '2'
            clients: android_vr
          - name: youtube-mweb
            sources: youtube_viral
            limit: '10'
            fetch: '2'
            clients: mweb
          - name: youtube-tv_embedded
            sources: youtube_viral
            limit: '10'
            fetch: '2'
            clients: tv_embedded
          - name: youtube-web_embedded
            sources: youtube_viral
            limit: '10'
            fetch: '2'
            clients: web_embedded
    name: probe-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q "yt-dlp[default]"
      - run: npm ci && npm run build
      - name: discover --dry-run
        env:
          WORK_DIR: ./work
          YOUTUBE_VIRAL_WINDOWS: today,week,month,alltime
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
          YTDLP_YOUTUBE_CLIENTS: ${{ matrix.clients }}
          YTDLP_ASSUME_FETCHABLE: 'true'
        run: node packages/pipeline/dist/cli.js discover --dry-run --sources "${{ matrix.sources }}" --limit "${{ matrix.limit }}" --fetch "${{ matrix.fetch }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: work/probe/
          if-no-files-found: ignore
          retention-days: 3

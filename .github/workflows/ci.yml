name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Offline template smoke render (FFmpeg only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-pil
          npm run brand:generate
          node packages/pipeline/dist/cli.js demo --offline
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 work/demo/demo_final.mp4 | grep -q "1080,1920"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-render
          path: |
            work/demo/demo_final.mp4
            work/demo/demo_final.jpg
          retention-days: 7

  # Non-blocking: shows what the credential-free viral sources find from a real runner IP and whether the top clip
  # can be fetched at full resolution (YouTube's bot wall is IP-dependent). Results are in the job summary.
  sourcing-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q "yt-dlp[default]"
      - run: npm ci && npm run build
      - name: discover --dry-run --fetch 2
        env:
          WORK_DIR: ./work
          YOUTUBE_VIRAL_WINDOWS: today,week,month,alltime
        run: node packages/pipeline/dist/cli.js discover --dry-run --sources youtube_viral,reddit_rss --limit 20 --fetch 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sourcing-probe-downloads
          path: work/probe/
          if-no-files-found: ignore
          retention-days: 3

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Offline template smoke render (FFmpeg only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-pil
          npm run brand:generate
          node packages/pipeline/dist/cli.js demo --offline
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 work/demo/demo_final.mp4 | grep -q "1080,1920"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-render
          path: |
            work/demo/demo_final.mp4
            work/demo/demo_final.jpg
          retention-days: 7

  # Heavy, non-blocking probes from a real GitHub-runner IP; run only when the push's commit message contains [probe].
  # reddit: discovery + download yield for a representative sample. youtube: which yt-dlp player clients (if any)
  # get past YouTube's bot wall without cookies. Results land in each job's summary.
  sourcing-probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: reddit
            sources: reddit_rss
            limit: '30'
            fetch: '25'
            clients: ''
          - name: youtube-default
            sources: youtube_viral
            limit: '10'
            fetch: '2'
            clients: ''
          - name: youtube-android
            sources: youtube_viral
            limit: '10'
            fetch: '2'
            clients: android
          - name: youtube-android_vr
            sources: youtube_viral
            limit: '10'
            fetch: '2'
            clients: android_vr
          - name: youtube-mweb
            sources: youtube_viral
            limit: '10'
            fetch: '2'
            clients: mweb
          - name: youtube-tv_embedded
            sources: youtube_viral
            limit: '10'
            fetch: '2'
            clients: tv_embedded
          - name: youtube-web_embedded
            sources: youtube_viral
            limit: '10'
            fetch: '2'
            clients: web_embedded
          - name: tiktok
            sources: tiktok
            limit: '10'
            fetch: '1'
            clients: ''
    name: probe-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q "yt-dlp[default]"
      - run: npm ci && npm run build
      - name: discover --dry-run
        env:
          WORK_DIR: ./work
          YOUTUBE_VIRAL_WINDOWS: today,week,month,alltime
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YTDLP_YOUTUBE_CLIENTS: ${{ matrix.clients }}
          YTDLP_ASSUME_FETCHABLE: 'true'
          # TikTok fetch probe: the owner's curated creators when set, otherwise one well-known public dog creator
          TIKTOK_ACCOUNTS: ${{ vars.TIKTOK_ACCOUNTS || 'tuckerbudzyn' }}
        run: node packages/pipeline/dist/cli.js discover --dry-run --sources "${{ matrix.sources }}" --limit "${{ matrix.limit }}" --fetch "${{ matrix.fetch }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: work/probe/
          if-no-files-found: ignore
          retention-days: 3

  # YouTube media fetch from a real GitHub-runner IP, per player client, with the Node JS runtime. Runs when the push's
  # commit message contains [fetchprobe]. Two public Shorts; result lines "FETCH <client> OK/FAIL" in the log.
  youtube-fetch-probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[fetchprobe]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -q "yt-dlp[default]" bgutil-ytdlp-pot-provider && yt-dlp --version
      - name: build the proof-of-origin token helper (free, account-less; yt-dlp's documented remedy for datacenter IPs)
        run: git clone -q --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git bgutil && cd bgutil/server && npm ci --silent && npx tsc && ls build/generate_once.js
      - name: fetch per client
        run: |
          POT="--extractor-args youtubepot-bgutilscript:script_path=$PWD/bgutil/server/build/generate_once.js"
          for client in web_embedded mweb web default; do
            for id in Xm2dOTnqtYQ y4MGfBLc0mM; do
              args=(--no-warnings --js-runtimes "node:$(which node)" $POT -f "bv*[height<=1080][ext=mp4]+ba[ext=m4a]/b[ext=mp4]/b" --merge-output-format mp4 -o "out_${client}_${id}.mp4")
              if [ "$client" != default ]; then args+=(--extractor-args "youtube:player_client=$client"); fi
              if timeout 240 yt-dlp "${args[@]}" "https://www.youtube.com/watch?v=$id" > "log_${client}_${id}.txt" 2>&1 && [ -s "out_${client}_${id}.mp4" ]; then
                echo "FETCH $client $id OK $(stat -c %s "out_${client}_${id}.mp4") bytes"
              else
                echo "FETCH $client $id FAIL: $(tail -n 2 "log_${client}_${id}.txt" | tr '\n' ' ' | cut -c1-300)"
              fi
            done
          done
      - name: tiktok creator page
        run: |
          timeout 120 yt-dlp --no-warnings --flat-playlist --playlist-end 3 -J "https://www.tiktok.com/@tuckerbudzyn" > tt.json 2> tt.err || true
          echo "TIKTOK rows: $(python3 -c "import json;d=json.load(open('tt.json'));print(len([e for e in d.get('entries',[]) if e]))" 2>/dev/null || echo 0) ; stderr: $(tail -n 2 tt.err | cut -c1-300)"

  # Live Buffer scheduling test that cannot publish: a scheduled post 400 days out through the guarded autopilot path,
  # read back, deleted within seconds. Runs when the push's commit message contains [bufferprobe].
  buffer-schedule-probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[bufferprobe]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: schedule + delete probe
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TOASTER_API_URL: ${{ vars.TOASTER_API_URL }}
          TOASTER_API_TOKEN: ${{ secrets.TOASTER_API_TOKEN }}
          UNATTENDED_AUTHORIZATION: I authorize The Unhinged Toaster to publish automatically without my review
          WORK_DIR: ./work
        run: node packages/pipeline/dist/cli.js buffer:probe-schedule --video "https://toaster-api.jchardukian.workers.dev/media/renders/01M6RNJPXYSG761WSKKJGRZHPP/01M6RNJPXYSG761WSKKJGRZHPP.final.mp4"

  # Viral funny-dog discovery from a real GitHub-runner IP (the "Dog shortlist" workflow is only dispatchable once it is
  # on main). Runs when the push's commit message contains [dogprobe]. Discovery only: no store, no drafts, ~$0.10.
  dog-shortlist-probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[dogprobe]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q "yt-dlp[default]"
      - run: npm ci && npm run build
      - name: dog-shortlist (discovery only)
        timeout-minutes: 25
        env:
          WORK_DIR: ./work
          API_BUDGET_USD: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          TIKTOK_ACCOUNTS: ${{ vars.TIKTOK_ACCOUNTS }}
        run: node packages/pipeline/dist/cli.js dog-shortlist --top 30 --limit 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dog-shortlist-probe
          path: |
            work/dog-shortlist.md
            work/dog-shortlist.json
            work/usage.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # Presentation A/B on real footage from a real runner (Reddit downloads are blocked elsewhere). Renders existing
  # productions with the live template and template.classic.json, runs QC on both, uploads previews to the control plane
  # under previews/ab/. Runs when the push's commit message contains [abprobe]. Nothing is published or scheduled.
  template-ab-probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[abprobe]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-pil && pip install -q "yt-dlp[default]"
      - run: npm ci && npm run build && npm run brand:generate
      - name: template A/B
        timeout-minutes: 30
        env:
          WORK_DIR: ./work
          API_BUDGET_USD: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          TOASTER_API_URL: ${{ vars.TOASTER_API_URL || 'https://toaster-api.jchardukian.workers.dev' }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          TOASTER_API_TOKEN: ${{ secrets.TOASTER_API_TOKEN }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: node packages/pipeline/dist/cli.js template-ab --id 01M6RP37RMNCJVTW1H84FHYYK4,01M6RPAG9GXDGM0SK1DJJ2BJ9Z
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-ab
          path: |
            work/ab/*/*.mp4
            work/ab/*/*.jpg
            work/ab/*/*.json
          if-no-files-found: ignore
          retention-days: 7
